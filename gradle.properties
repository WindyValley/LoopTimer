android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m

# Single source of truth for app version (MAJOR.MINOR.PATCH).
# versionName is derived in app/build.gradle.kts; versionCode = MAJOR*10000 + MINOR*100 + PATCH.
# Kotlin code must read BuildConfig.VERSION_NAME - never hardcode.
VERSION_MAJOR=1
VERSION_MINOR=0
VERSION_PATCH=2
