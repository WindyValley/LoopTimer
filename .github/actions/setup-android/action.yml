name: Setup Android build environment
description: Provisions JDK 17, the Android SDK, Gradle caching and an executable gradlew.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 旧的 'tools' 包已被 Google 从 SDK 仓库移除，写了会导致
        # sdkmanager 报 "Failed to find package 'tools'" 直接失败。
        # 只装项目实际需要的：platform-tools + compileSdk 对应平台；
        # build-tools 由 AGP 按需要自动下载（license 已由本 action 接受）。
        packages: platform-tools platforms;android-35

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Grant gradlew permission
      shell: bash
      run: chmod +x gradlew
